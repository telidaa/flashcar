<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>FlashCar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
/* Obsidian (dark) and whitestone (light). Colour carries meaning only:
   blue = mastered, cyan = learning, red = slipped back or wrong. */
:root{
  --bg:#0b0c0f; --surface:#131419; --raise:#1c1e25; --line:#2a2d36; --axis:#3a3e4a;
  --fg:#eeeeeb; --muted:#a0a3ab; --track:#262830;
  --blue:#2a66de; --cyan:#18a5c0; --red:#e0524f;
  --blue-ink:#7fb0f5; --red-ink:#ff8d88; --on-cyan:#0b0c0f;
}
:root[data-theme="light"]{
  --bg:#efefec; --surface:#fafaf8; --raise:#e5e5e1; --line:#d6d6d1; --axis:#bdbdb7;
  --fg:#0c0d10; --muted:#5b5d64; --track:#deded9;
  --blue:#1b52c9; --cyan:#0c93b3; --red:#cf3a3a;
  --blue-ink:#1b52c9; --red-ink:#b42b2b; --on-cyan:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 Onest,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.025em;font-weight:800}
h1{font-size:clamp(28px,4.4vw,40px)}
h2{font-size:21px;font-weight:700}
h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
small{font-size:13px;color:var(--muted)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.03em;font-style:italic}
.logo svg{width:30px;height:30px;flex:none}
.logo .bolt{fill:var(--bg)}
nav{display:flex;gap:2px;justify-content:center}
nav a{padding:8px 14px;border-radius:8px;font-weight:600;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
nav a svg,.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{color:var(--fg);background:var(--raise)}
nav a.on{color:var(--bg);background:var(--fg)}
.top-r{display:flex;align-items:center;gap:8px}
.segc{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.segc button{border:0;background:transparent;padding:7px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.segc button.on{background:var(--fg);color:var(--bg)}
.ib{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ib:hover{background:var(--raise)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);font-weight:800;display:grid;place-items:center;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.big{width:96px;height:96px;font-size:38px}
@media (max-width:820px){
  .top-in{grid-template-columns:1fr auto;row-gap:8px}
  nav{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:repeat(4,1fr)}
  nav a{justify-content:center;padding:8px 2px;font-size:13px;gap:5px}
  nav a svg{width:15px;height:15px}
  .hide-s{display:none!important}
}

main{max-width:1120px;margin:0 auto;padding:28px 16px 80px}
.stack>*+*{margin-top:28px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);margin-top:6px;max-width:68ch}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
.two.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.two>*,.hero>*{min-width:0}
@media (max-width:820px){.two,.two.even{grid-template-columns:minmax(0,1fr)}}

/* buttons and inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:8px;font-weight:700;font-size:15px;white-space:nowrap;position:relative}
.btn:hover{background:var(--raise)}
.btn.pri{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.pri:hover{opacity:.88}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{color:var(--red-ink)}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file:focus-within{outline:2px solid var(--fg);outline-offset:2px}
.field{display:block}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=search],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;outline:none}
input:focus,select:focus{border-color:var(--fg)}
.search{max-width:440px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
a.row:hover{background:var(--raise)}
.ticon{width:36px;height:36px;border-radius:8px;background:var(--raise);display:grid;place-items:center;flex:none;font-weight:700;font-size:17px}
.ticon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rmain{flex:1;min-width:0}
.rmain b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rprog{width:170px;flex:none;text-align:right}
.rprog small{display:block;margin-top:5px}
@media (max-width:520px){.rprog{width:96px}}
.empty{text-align:center;padding:32px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* progress marks */
.seg{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;width:100%}
.seg i{display:block;min-width:3px;font-style:normal}
.seg .m,.sw.m{background:var(--blue)}
.seg .l,.sw.l{background:var(--cyan)}
.seg .r,.sw.r{background:var(--red)}
.seg .n,.sw.n{background:var(--track)}
.seg.tall{height:28px;border-radius:0}
.seg.tall i{border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:13px;font-weight:700;color:#fff;overflow:hidden}
.seg.tall .l{color:var(--on-cyan)}
.seg.tall .n{color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;flex:none}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:500}
.legend span{display:inline-flex;align-items:center}
.meter{height:8px;border-radius:99px;background:color-mix(in srgb,var(--blue) 22%,var(--surface));overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-a{padding:6px 0}
.hero-a p{color:var(--muted);margin-top:10px;max-width:52ch}
.hero-a .btn{margin-top:18px;white-space:normal;text-align:left}
.goal b{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.goal b span{font-size:18px;color:var(--muted);font-weight:500;letter-spacing:0}
.goal .meter{margin:14px 0 10px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
.kpis.five{grid-template-columns:repeat(5,1fr)}
@media (max-width:820px){.kpis,.kpis.five{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .kl{display:flex;align-items:center;font-size:13px;color:var(--muted);font-weight:500}
.kpi b{display:block;font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:4px}
.delta{font-size:13px;font-weight:600}
.delta.up{color:var(--blue-ink)}
.delta.down{color:var(--red-ink)}
.subj{display:grid;grid-template-columns:36px minmax(96px,1fr) 2fr auto;gap:6px 14px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line);width:100%;background:transparent;text-align:left}
.subj:first-of-type{border-top:0}
.subj:hover .sn{text-decoration:underline}
.subj .sn{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subj .fig{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right;min-width:92px}
.subj .fig b{color:var(--fg);font-size:15px;margin-right:6px}
@media (max-width:560px){.subj{grid-template-columns:36px 1fr auto}.subj .seg{grid-column:2/4;grid-row:2}.subj .fig{grid-column:3;grid-row:1}}
.plot{position:relative;height:134px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:end;border-bottom:1px solid var(--axis);margin-top:14px;padding-right:26px}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.gl em{position:absolute;right:0;top:-17px;font-size:11px;color:var(--muted);font-style:normal}
.colw{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;z-index:1}
.colw:hover .col{opacity:.8}
.col{display:flex;flex-direction:column;gap:2px;width:min(24px,62%)}
.col i{display:block}
.col .w{background:var(--red)}
.col .r{background:var(--blue)}
.col i:first-child{border-radius:4px 4px 0 0}
.cap{font-size:12px;font-weight:700;margin-bottom:4px}
.xax{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;text-align:center;font-size:12px;color:var(--muted);margin-top:6px;padding-right:26px}
details.tv{margin-top:14px;font-size:13px}
details.tv summary{cursor:pointer;color:var(--muted);font-weight:600;width:max-content}
table{border-collapse:collapse;width:100%;margin-top:10px;font-size:13px}
th,td{text-align:right;padding:6px 8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;border-top:0}
.rev{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rev:first-of-type{border-top:0}
.rev .rmain b{font-size:17px}

/* discover */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile:hover{border-color:var(--axis)}
.tile-h{display:flex;align-items:center;gap:10px}
.tile p{font-size:14px;color:var(--muted);flex:1}
.tile-f{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tile-b{display:flex;gap:6px}

/* set page */
.modes{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:block}
.mode:hover{border-color:var(--fg)}
.mode b{display:block;font-size:17px}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
.term{display:grid;grid-template-columns:1fr 1.5fr auto;gap:16px;padding:13px 16px;border-top:1px solid var(--line);align-items:center}
.term:first-child{border-top:0}
.term b{font-weight:700;overflow-wrap:anywhere;display:block}
.term b[lang]{font-size:24px;font-weight:500}
.term .td{color:var(--muted);overflow-wrap:anywhere;display:flex;align-items:center;gap:10px}
@media (max-width:560px){.term{grid-template-columns:1fr auto}.term .td{grid-column:1/3;grid-row:2}}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.cimg{border-radius:6px;display:block;object-fit:cover;flex:none}
.cimg.sm{width:44px;height:44px}
.cimg.big{max-height:150px;width:auto;margin:0 auto 12px;object-fit:contain}

/* study */
.study{max-width:760px;margin:0 auto}
.study-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.study-top b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flip{perspective:1400px;height:min(400px,58vh);cursor:pointer;margin:16px 0}
.flip-in{position:relative;width:100%;height:100%;transition:transform .4s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d}
.flip.f .flip-in{transform:rotateX(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--axis);border-radius:12px;display:grid;place-items:center;padding:36px 24px 24px;text-align:center;overflow:auto}
.face.b{transform:rotateX(180deg)}
.fl{position:absolute;top:12px;left:16px;font-size:13px;font-weight:600;color:var(--muted)}
.tt{font-size:clamp(26px,5vw,40px);font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.tt.zh{font-size:clamp(64px,15vw,104px);font-weight:500;letter-spacing:0;line-height:1.1}
.tt.zh.long{font-size:clamp(44px,10vw,72px)}
.py{font-size:clamp(20px,3.6vw,28px);color:var(--muted);margin-bottom:8px}
.dd{font-size:clamp(20px,3.4vw,28px);font-weight:600;overflow-wrap:anywhere}
.ctrl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ctrl .btn{flex:1;max-width:240px;padding:14px}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.q .tt{margin:8px 0 6px}
.q .tt.zh{font-size:clamp(48px,11vw,72px)}
.q .py{font-size:20px;min-height:30px}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:14px}
@media (max-width:600px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px;font-weight:600;display:flex;gap:10px;align-items:center;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--fg)}
.opt kbd{font:inherit;color:var(--muted);font-weight:700}
.opt .ob{display:flex;align-items:center;gap:10px;min-width:0}
.opt.ok{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 16%,transparent)}
.opt.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 16%,transparent)}
.fb{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700}
.fb .delta{font-size:15px}
.match{display:grid;gap:10px;grid-template-columns:repeat(4,1fr)}
@media (max-width:600px){.match{grid-template-columns:repeat(2,1fr)}}
.mt{min-height:96px;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px;font-weight:600;font-size:14px;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.mt[lang]{font-size:26px;font-weight:500}
.mt.sel{border-color:var(--fg);background:var(--raise)}
.mt.bad{border-color:var(--red);animation:shake .3s}
.mt.gone{visibility:hidden}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.done{text-align:center;padding:36px 20px}
.done h2{font-size:28px;margin:0 0 8px}
.done .ctrl{margin-top:22px}

/* editor */
.crow{padding:14px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.crow-top b{flex:1;color:var(--muted)}
.crow-f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:600px){.crow-f{grid-template-columns:1fr}}
.err{color:var(--red-ink);font-weight:600}

/* profile */
details.topic{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.topic+details.topic{margin-top:10px}
details.topic summary{list-style:none;display:flex;align-items:center;gap:14px;padding:13px 16px;cursor:pointer}
details.topic summary::-webkit-details-marker{display:none}
details.topic summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none;margin:0 4px 4px}
details.topic[open] summary::after{transform:rotate(225deg);margin:4px 4px 0}
details.topic .row{border-top:1px solid var(--line)}
.prof{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.prof input[type=text]{max-width:280px;font-size:20px;font-weight:700}
.setline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.setline:first-of-type{border-top:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:700;font-size:14px;z-index:50;max-width:calc(100vw - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>

  cont:['Continue','Продолжить'],start:['Start with a set','Начать с набора'],

  k_acc:['Accuracy this week','Точность за неделю'],k_streak:['Day streak','Дней подряд'],k_ans:['Cards answered','Всего ответов'],
  vs_week:['{0} pts vs last week','{0} п. п. к прошлой неделе'],this_week:['{0} this week','{0} за неделю'],
  by_subject:['Progress by subject','Прогресс по предметам'],
  by_subject_sub:['How much of each subject you have mastered. Tap a subject to open its sets.','Сколько выучено по каждому предмету. Нажми на предмет, чтобы открыть его наборы.'],
  no_subject:['Add a set to see your subjects here.','Добавь набор, и здесь появятся предметы.'],

function chart(days){
  var H=112,mx=Math.max(4,Math.max.apply(null,days.map(function(d){return d.r+d.w;})));
  var step=mx<=10?2:mx<=40?10:mx<=100?20:50;mx=Math.ceil(mx/step)*step;
  var cols=days.map(function(d,i){
    var tot=d.r+d.w,lab=d.date.toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'})+': '+t('right')+' '+d.r+', '+t('wrong')+' '+d.w;
    return '<div class="colw" title="'+esc(lab)+'">'+(i===days.length-1&&tot?'<b class="cap">'+tot+'</b>':'')+'<div class="col">'+(d.w?'<i class="w" style="height:'+Math.max(3,Math.round(d.w/mx*H))+'px"></i>':'')+(d.r?'<i class="r" style="height:'+Math.max(3,Math.round(d.r/mx*H))+'px"></i>':'')+'</div></div>';
  }).join('');
  var xs=days.map(function(d,i){return '<span>'+(days.length>7?((days.length-1-i)%2?'':d.date.getDate()):d.date.toLocaleDateString(loc(),{weekday:'short'}))+'</span>';}).join('');
  var rows=days.map(function(d){return '<tr><td>'+d.date.toLocaleDateString(loc(),{day:'numeric',month:'short'})+'</td><td>'+d.r+'</td><td>'+d.w+'</td><td>'+(d.r+d.w)+'</td></tr>';}).join('');
  return '<div class="legend" style="margin-top:12px"><span><i class="sw m"></i>'+t('right')+'</span><span><i class="sw r"></i>'+t('wrong')+'</span></div><div class="plot" role="img" aria-label="'+esc(t('week_sub'))+'"><span class="gl" style="bottom:'+H+'px"><em>'+mx+'</em></span><span class="gl" style="bottom:'+H/2+'px"><em>'+mx/2+'</em></span>'+cols+'</div><div class="xax">'+xs+'</div><details class="tv"><summary>'+t('table')+'</summary><table><tr><th>'+t('day')+'</th><th>'+t('right')+'</th><th>'+t('wrong')+'</th><th>'+t('total')+'</th></tr>'+rows+'</table></details>';
}

  h+='<section><h2>'+t('terms_h')+'</h2><div class="rows" style="margin-top:12px">'+s.cards.map(function(c){var v=cst(id,c.id);return '<div class="term"><div><b'+zhA(s)+'>'+esc(L(c.t))+'</b>'+(c.p?'<small>'+esc(c.p)+'</small>':'')+'</div><div class="td">'+imgH(c,'sm')+'<span>'+esc(L(c.d))+'</span></div><span class="pill"><i class="sw '+sw[v]+'"></i>'+lab[v]+'</span></div>';}).join('')+'</div></section>';
  return h+'</div>';
}

/* ---------- study modes ---------- */
function startSession(id,mode){
  var s=getSet(id);session=null;if(!s||!s.cards.length)return;
  var need=[1,2,3,0],byNeed=shuffle(s.cards).sort(function(a,b){return need[cst(id,a.id)]-need[cst(id,b.id)];});
  if(mode==='learn'){session={mode:'learn',id:id,q:shuffle(byNeed.slice(0,10)),i:0,right:0,wrong:0,pick:null};mkOpts();}
  else if(mode==='match'){
    var pick=shuffle(s.cards).slice(0,6),tiles=[];
    pick.forEach(function(c){tiles.push({c:c,side:'t'});tiles.push({c:c,side:'d'});});
    session={mode:'match',id:id,tiles:shuffle(tiles),sel:null,bad:[],left:pick.length,t0:Date.now(),time:null};
    session.timer=setInterval(function(){var e=document.getElementById('mtime');if(e&&session&&session.mode==='match'&&session.left)e.textContent=((Date.now()-session.t0)/1000).toFixed(1)+' s';},100);
  }else session={mode:'flash',id:id,q:byNeed,i:0,flip:false,right:0,wrong:0};
}
function endSession(){if(session&&session.timer)clearInterval(session.timer);session=null;}
function okey(c){return L(c.d)+'|'+(c.img||'');}
function mkOpts(){
  var z=session,s=getSet(z.id),c=z.q[z.i],seen={},o=[];seen[okey(c)]=1;
  shuffle(s.cards).forEach(function(k){if(k.id!==c.id&&!seen[okey(k)]&&o.length<3){seen[okey(k)]=1;o.push(k);}});
  o.push(c);z.opts=shuffle(o);z.pick=null;
}
function studyTop(s,label,n,total){
  return '<div class="study-top"><a class="btn sm" href="#set/'+esc(s.id)+'">'+t('back')+'</a><b>'+esc(L(s.title))+'</b><small id="mtime">'+label+'</small></div>'+(total?'<div class="meter"><i style="width:'+(n/total*100)+'%"></i></div>':'');
}
function doneView(s,title,text){
  var x=stats(s);
  return '<div class="study"><div class="panel done"><h2>'+title+'</h2><p class="sub" style="margin:0 auto">'+text+'</p><div style="max-width:380px;margin:20px auto 0">'+seg(x,1)+'<small style="display:block;margin-top:8px">'+t('pct_set',x.pct)+'</small></div><div class="ctrl"><button class="btn pri" data-act="again">'+t('again')+'</button><a class="btn" href="#set/'+esc(s.id)+'">'+t('back_set')+'</a></div></div></div>';
}
function termH(s,c){var v=L(c.t);return '<div class="tt'+(s.zh?' zh'+(v.length>3?' long':''):'')+'"'+zhA(s)+'>'+esc(v)+'</div>';}
function vStudy(){
  var z=session,s=getSet(z.id);
  if(z.mode==='flash'){
    if(z.i>=z.q.length)return doneView(s,t('fl_done'),t('fl_done_s',z.right,z.wrong));
    var c=z.q[z.i],dfirst=S.front==='d';
    var A='<div>'+termH(s,c)+'</div>',B='<div>'+(c.p?'<div class="py">'+esc(c.p)+'</div>':'')+imgH(c,'big')+'<div class="dd">'+esc(L(c.d))+'</div></div>';
    return '<div class="study">'+studyTop(s,(z.i+1)+' / '+z.q.length,z.i,z.q.length)+'<div class="flip'+(z.flip?' f':'')+'" data-act="flip" role="button" tabindex="0"><div class="flip-in"><div class="face"><span class="fl">'+(dfirst?t('defn'):t('term'))+'</span>'+(dfirst?B:A)+'</div><div class="face b"><span class="fl">'+(dfirst?t('term'):t('defn'))+'</span>'+(dfirst?A:B)+'</div></div></div><div class="ctrl"><button class="btn" data-act="fl" data-id="0">'+t('still')+'</button><button class="btn pri" data-act="fl" data-id="1">'+t('know')+'</button></div><p class="hint">'+t('flash_hint')+'</p><p class="hint"><button class="chip" data-act="front">'+(dfirst?t('front_d'):t('front_t'))+'</button></p></div>';
  }
  if(z.mode==='learn'){
    if(z.i>=z.q.length)return doneView(s,z.wrong?t('round_done'):t('perfect'),t('round_s',z.right,z.wrong));
    var q=z.q[z.i],done=z.pick!==null,ok=done&&z.opts[z.pick].id===q.id;
    return '<div class="study">'+studyTop(s,(z.i+1)+' / '+z.q.length,z.i,z.q.length)+'<div class="q" style="margin-top:16px"><small>'+t('choose')+'</small>'+termH(s,q)+(q.p?'<div class="py">'+(done?esc(q.p):'')+'</div>':'')+'<div class="opts">'+z.opts.map(function(o,i){var cl=done?(o.id===q.id?' ok':(i===z.pick?' no':'')):'';return '<button class="opt'+cl+'" data-act="opt" data-id="'+i+'"'+(done?' disabled':'')+'><kbd>'+(i+1)+'</kbd><span class="ob">'+imgH(o,'sm')+'<span>'+esc(L(o.d))+'</span></span></button>';}).join('')+'</div>'+(done?'<div class="fb"><span class="delta '+(ok?'up':'down')+'">'+(ok?'▲ '+t('correct'):'▼ '+t('notq'))+'</span><button class="btn pri" data-act="next">'+t('cont_b')+'</button></div>':'')+'</div><p class="hint">'+t('learn_hint',z.opts.length)+'</p></div>';
  }
  if(z.left===0){var best=prog(z.id).best;return doneView(s,t('match_done',z.time.toFixed(1)),best&&best<z.time?t('match_best',best.toFixed(1)):t('match_new'));}
  return '<div class="study">'+studyTop(s,((Date.now()-z.t0)/1000).toFixed(1)+' s')+'<div class="match">'+z.tiles.map(function(m,i){return '<button class="mt'+(m.gone?' gone':'')+(z.sel===i?' sel':'')+(z.bad.indexOf(i)>=0?' bad':'')+'" data-act="mt" data-id="'+i+'"'+(m.side==='t'?zhA(s):'')+'>'+(m.side==='t'?esc(L(m.c.t)):imgH(m.c,'sm')+'<span>'+esc(L(m.c.d))+'</span>')+'</button>';}).join('')+'</div><p class="hint">'+t('match_hint')+'</p></div>';
}

/* ---------- editor ---------- */
function newDraft(id,copy){
  if(!id)return {id:null,title:'',topic:'languages',desc:'',zh:false,cards:[0,1,2].map(function(i){return {id:i,t:'',d:'',p:'',img:''};}),next:3,err:''};
  var s=copy?getSet(id):S.sets[id];if(!s)return null;
  var cards=s.cards.map(function(c,i){return {id:copy?i:c.id,t:L(c.t),d:L(c.d),p:c.p||'',img:c.img||''};});
  return {id:copy?null:id,title:copy?t('copy_of',L(s.title)):s.title,topic:tkey(s),desc:L(s.desc),zh:!!s.zh,cards:cards,next:cards.reduce(function(m,c){return Math.max(m,c.id+1);},0),err:''};
}
function vEdit(){
  var d=draft;
  return '<div class="stack" style="max-width:820px;margin:0 auto"><div class="head"><h1>'+(d.id?t('ed_edit'):t('ed_new'))+'</h1><button class="btn pri" data-act="saveSet">'+t('save')+'</button></div><section class="panel"><label class="field"><span>'+t('title')+'</span><input type="text" data-df="title" maxlength="80" placeholder="'+t('title_ph')+'" value="'+esc(d.title)+'"></label><div class="crow-f" style="margin-top:14px"><label class="field"><span>'+t('topic')+'</span><select data-df="topic">'+Object.keys(TOPICS).map(function(k){return '<option value="'+k+'"'+(d.topic===k?' selected':'')+'>'+esc(tname(k))+'</option>';}).join('')+'</select></label><label class="field"><span>'+t('desc')+'</span><input type="text" data-df="desc" maxlength="140" value="'+esc(d.desc)+'"></label></div></section><section class="panel"><h2>'+t('cards_h')+'</h2><div style="margin-top:6px">'+d.cards.map(function(c,i){
    return '<div class="crow"><div class="crow-top"><b>'+(i+1)+'</b>'+imgH(c,'sm')+'<label class="btn sm file"><input type="file" accept="image/*" data-file="card" data-ci="'+i+'">'+(c.img?t('pic_change'):t('pic_add'))+'</label>'+(c.img?'<button class="btn sm" data-act="rmPic" data-id="'+i+'">'+t('pic_rm')+'</button>':'')+'<button class="btn sm" data-act="rmCard" data-id="'+i+'" aria-label="'+t('rm_card')+' '+(i+1)+'">✕</button></div><div class="crow-f"><input type="text" data-ci="'+i+'" data-cf="t" placeholder="'+t('term_ph')+'" aria-label="'+t('term_ph')+' '+(i+1)+'" value="'+esc(c.t)+'"><input type="text" data-ci="'+i+'" data-cf="d" placeholder="'+t('def_ph')+'" aria-label="'+t('def_ph')+' '+(i+1)+'" value="'+esc(c.d)+'"></div><div class="crow-f"><input type="text" data-ci="'+i+'" data-cf="p" placeholder="'+t('hint_ph')+'" aria-label="'+t('hint_ph')+' '+(i+1)+'" value="'+esc(c.p)+'"></div></div>';
  }).join('')+'</div><button class="btn" data-act="addCard" style="margin-top:12px">+ '+t('add_card')+'</button></section>'+(d.err?'<p class="err" role="alert">'+esc(d.err)+'</p>':'')+'<div class="head"><a class="btn" href="'+(d.id?'#set/'+esc(d.id):'#materials')+'">'+t('cancel')+'</a><button class="btn pri" data-act="saveSet">'+t('save')+'</button></div></div>';
}
function readImg(file,max,square){
  return new Promise(function(res,rej){
    if(!file||!/^image\//.test(file.type)){rej();return;}
    var r=new FileReader();r.onerror=rej;
    r.onload=function(){
      var im=new Image();im.onerror=rej;
      im.onload=function(){
        var w=im.naturalWidth,h=im.naturalHeight,sx=0,sy=0,sw=w,sh=h,dw,dh;
        if(!w||!h){rej();return;}
        if(square){var m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;dw=dh=max;}
        else{var k=Math.min(1,max/Math.max(w,h));dw=Math.max(1,Math.round(w*k));dh=Math.max(1,Math.round(h*k));}
        var c=document.createElement('canvas');c.width=dw;c.height=dh;var g=c.getContext('2d');
        g.fillStyle='#fff';g.fillRect(0,0,dw,dh);g.drawImage(im,sx,sy,sw,sh,0,0,dw,dh);
        res(c.toDataURL('image/jpeg',.82));
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

/* ---------- header and router ---------- */
var NAV=[['home','nav_home','M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],['materials','nav_mat','M5 6h12a2 2 0 0 1 2 2v12H7a2 2 0 0 1-2-2zM8 3h11a2 2 0 0 1 2 2v12'],['progress','nav_prog','M4 20V10M10 20V4M16 20v-7M22 20H2'],['discover','nav_disc','M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM15.5 8.5l-2 5-5 2 2-5z']];
function topH(r){
  var cur={materials:1,progress:1,discover:1,profile:1}[r.v]?r.v:{set:1,study:1,create:1,edit:1,copy:1}[r.v]?'materials':'home';
  return '<div class="top-in"><a class="logo" href="#home" aria-label="FlashCar"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="22" rx="5" fill="currentColor"/><path class="bolt" d="M17.5 8.5l-6 8.5H16l-1.5 6.5 6-8.5H16z"/></svg><span>FlashCar</span></a><nav aria-label="Main">'+NAV.map(function(n){return '<a href="#'+n[0]+'"'+(cur===n[0]?' class="on" aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+n[2]+'"/></svg>'+t(n[1])+'</a>';}).join('')+'</nav><div class="top-r">'+segc('setLang',lang,[['en','EN'],['ru','RU']])+'<button class="ib hide-s" data-act="theme" aria-label="'+t('theme')+'" title="'+t('theme')+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button><a class="btn pri sm" href="#create" aria-label="'+t('create')+'">+<span class="hide-s">'+t('create')+'</span></a><a href="#profile" aria-label="'+t('profile')+'">'+avatarH()+'</a></div></div>';
}
function parse(){var h=(location.hash||'#home').slice(1).split('/');var a='';try{a=decodeURIComponent(h[1]||'');}catch(e){}return {v:h[0],a:a,b:h[2]||''};}
function view(r){
  switch(r.v){
    case 'materials':return vMaterials();
    case 'progress':return vProgress();
    case 'discover':return vDiscover();
    case 'profile':return vProfile();
    case 'set':return vSet(r.a);
    case 'study':return session?vStudy():vSet(r.a);
    case 'create':case 'edit':case 'copy':return draft?vEdit():vSet('');
    default:return vHome();
  }
}
function paint(){var r=parse();document.documentElement.lang=lang;$top.innerHTML=topH(r);$app.innerHTML=view(r);}
function route(){
  var r=parse();endSession();armed=null;draft=null;
  if(r.v==='study')startSession(r.a,r.b);
  if(r.v==='create')draft=newDraft();
  if(r.v==='edit')draft=newDraft(r.a);
  if(r.v==='copy')draft=newDraft(r.a,true);
  paint();window.scrollTo(0,0);
}
function redraw(){var y=window.scrollY;paint();window.scrollTo(0,y);}
function applyTheme(){document.documentElement.setAttribute('data-theme',S.theme||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'));}

/* ---------- actions ---------- */
function arm(name){if(armed===name){armed=null;return true;}armed=name;redraw();return false;}
var acts={
  lib:function(id){var i=S.library.indexOf(id);if(i>=0){S.library.splice(i,1);toast(t('t_removed'));}else{S.library.unshift(id);toast(t('t_added'));}save();redraw();},
  matTopic:function(id){ui.matTopic=id;redraw();},
  disTopic:function(id){ui.disTopic=id;redraw();},
  goTopic:function(id){ui.matTopic=id;ui.matQ='';if(parse().v==='materials')redraw();else location.hash='#materials';},
  theme:function(){S.theme=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';save();applyTheme();redraw();},
  setTheme:function(id){S.theme=id;save();applyTheme();redraw();},
  setLang:function(id){lang=S.lang=id;save();redraw();},
  jump:function(id){var e=document.getElementById('tp-'+id);if(e){e.open=true;e.scrollIntoView({behavior:'smooth',block:'start'});}},
  rmAvatar:function(){delete S.avatar;save();redraw();},
  wipe:function(){if(arm('wipe')){S={name:'',library:[],sets:{},progress:{},days:{},theme:S.theme,lang:lang,v:2};save();toast(t('t_erased'));redraw();}},
  reset:function(id){if(arm('reset')){delete S.progress[id];save();toast(t('t_reset'));redraw();}},
  del:function(id){if(arm('del')){delete S.sets[id];delete S.progress[id];S.library=S.library.filter(function(x){return x!==id;});save();toast(t('t_deleted'));location.hash='#materials';}},
  flip:function(){session.flip=!session.flip;var e=document.querySelector('.flip');if(e)e.classList.toggle('f',session.flip);},
  front:function(){S.front=S.front==='d'?'t':'d';save();session.flip=false;redraw();},
  fl:function(v){var z=session;if(z.i>=z.q.length)return;var ok=v==='1';record(z.id,z.q[z.i].id,ok);if(ok)z.right++;else z.wrong++;z.i++;z.flip=false;redraw();},
  opt:function(v){var z=session;if(z.pick!==null)return;z.pick=+v;var q=z.q[z.i],ok=z.opts[z.pick].id===q.id;record(z.id,q.id,ok);if(ok)z.right++;else z.wrong++;redraw();var n=document.querySelector('[data-act=next]');if(n)n.focus();},
  next:function(){var z=session;z.i++;if(z.i<z.q.length)mkOpts();redraw();},
  mt:function(v){
    var z=session,i=+v,m=z.tiles[i];if(m.gone||z.bad.length)return;
    if(z.sel===null)z.sel=i;
    else if(z.sel===i)z.sel=null;
    else{
      var a=z.tiles[z.sel];
      if(a.c.id===m.c.id&&a.side!==m.side){
        a.gone=m.gone=true;z.sel=null;z.left--;today().r++;prog(z.id).last=Date.now();if(!inLib(z.id))S.library.unshift(z.id);
        if(z.left===0){clearInterval(z.timer);z.time=(Date.now()-z.t0)/1000;var p=prog(z.id);if(!p.best||z.time<p.best)p.best=z.time;}
        save();
      }else{today().w++;save();z.bad=[z.sel,i];z.sel=null;setTimeout(function(){if(session===z){z.bad=[];redraw();}},350);}
    }
    redraw();
  },
  again:function(){var z=session;endSession();startSession(z.id,z.mode);redraw();},
  addCard:function(){draft.cards.push({id:draft.next++,t:'',d:'',p:'',img:''});draft.err='';redraw();var r=document.querySelectorAll('[data-cf=t]');if(r.length)r[r.length-1].focus();},
  rmCard:function(v){draft.cards.splice(+v,1);redraw();},
  rmPic:function(v){draft.cards[+v].img='';redraw();},
  saveSet:function(){
    var d=draft,cards=d.cards.map(function(c){var o={id:c.id,t:c.t.trim(),d:c.d.trim()};if(c.p&&c.p.trim())o.p=c.p.trim();if(c.img)o.img=c.img;return o;}).filter(function(c){return c.t&&(c.d||c.img);});
    if(!d.title.trim()){d.err=t('err_title');redraw();return;}
    if(cards.length<2){d.err=t('err_cards');redraw();return;}
    var id=d.id||('my'+Date.now().toString(36)),old=S.sets[id],hadLib=inLib(id);
    S.sets[id]={id:id,title:d.title.trim(),topic:d.topic,desc:d.desc.trim(),zh:d.zh||d.topic==='chinese',cards:cards};
    if(!hadLib)S.library.unshift(id);
    if(!save()){if(old)S.sets[id]=old;else delete S.sets[id];if(!hadLib)S.library.shift();d.err=t('t_full');redraw();return;}
    toast(t('t_saved'));location.hash='#set/'+id;
  }
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(armed&&armed!==a)armed=null;
  if(acts[a])acts[a](b.getAttribute('data-id'));
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='matQ'){ui.matQ=el.value;document.getElementById('matList').innerHTML=matList();}
  else if(el.id==='disQ'){ui.disQ=el.value;document.getElementById('disList').innerHTML=disList();}
  else if(el.id==='nameIn'){S.name=el.value.trim();save();if(!S.avatar){var c=(S.name||'A').charAt(0).toUpperCase();[].forEach.call(document.querySelectorAll('.avatar'),function(a){a.textContent=c;});}}
  else if(draft&&el.hasAttribute('data-df')){draft[el.getAttribute('data-df')]=el.value;}
  else if(draft&&el.hasAttribute('data-cf')){draft.cards[+el.getAttribute('data-ci')][el.getAttribute('data-cf')]=el.value;}
});
document.addEventListener('change',function(e){
  var el=e.target,kind=el.getAttribute&&el.getAttribute('data-file');if(!kind||!el.files||!el.files[0])return;
  var file=el.files[0];
  if(kind==='avatar'){
    readImg(file,160,true).then(function(url){var old=S.avatar;S.avatar=url;if(!save()){if(old)S.avatar=old;else delete S.avatar;toast(t('t_full'));}else toast(t('t_photo'));redraw();},function(){toast(t('t_badimg'));});
  }else if(kind==='card'&&draft){
    var i=+el.getAttribute('data-ci');
    readImg(file,360,false).then(function(url){if(draft&&draft.cards[i]){draft.cards[i].img=url;redraw();}},function(){toast(t('t_badimg'));});
  }
});
document.addEventListener('keydown',function(e){
  if(!session||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  var z=session;
  if(z.mode==='flash'&&z.i<z.q.length){
    if(e.key===' '||(e.key==='Enter'&&e.target.classList.contains('flip'))){e.preventDefault();acts.flip();}
    else if(e.key==='ArrowRight')acts.fl('1');
    else if(e.key==='ArrowLeft')acts.fl('0');
  }else if(z.mode==='learn'&&z.i<z.q.length){
    if(z.pick===null&&/^[1-4]$/.test(e.key)&&+e.key<=z.opts.length)acts.opt(String(+e.key-1));
    else if(z.pick!==null&&e.key==='Enter'){e.preventDefault();acts.next();}
  }
});
applyTheme();
window.addEventListener('hashchange',route);
route();
})();
