<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlashCar — flashcards that stick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1022; --surface:#151b33; --raise:#1e2646; --fg:#f3f5fc; --muted:#9aa3c2; --line:#2a3358;
  --primary:#4a66ff; --primary-ink:#ffffff; --accent:#ffcd1f; --accent-ink:#1b1500;
  --ok:#35c98b; --bad:#ff6b6b; --shadow:0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#f5f6fb; --surface:#ffffff; --raise:#eceffa; --fg:#14182d; --muted:#5a6384; --line:#dde2f1;
  --primary:#3b56f5; --primary-ink:#ffffff; --accent:#ffcd1f; --accent-ink:#1b1500;
  --ok:#1f9d68; --bad:#d94545; --shadow:0 10px 30px rgba(30,40,90,.12);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.02em}
h1{font-size:clamp(26px,4vw,36px);font-weight:800}
h2{font-size:20px;font-weight:700}
p{margin:0}
small{font-size:13px;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.03em}
.logo svg{width:34px;height:34px;flex:none}
.logo em{font-style:normal;color:var(--accent)}
nav{display:flex;gap:4px;justify-content:center}
nav a{padding:9px 16px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
nav a svg{width:18px;height:18px}
nav a:hover{color:var(--fg);background:var(--raise)}
nav a.on{color:var(--primary-ink);background:var(--primary)}
.top-r{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;display:grid;place-items:center;flex:none;border:2px solid transparent}
.avatar.on{border-color:var(--fg)}
.avatar.big{width:76px;height:76px;font-size:32px}
@media (max-width:760px){
  .top-in{grid-template-columns:1fr auto;row-gap:8px}
  nav{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:repeat(4,1fr)}
  nav a{justify-content:center;padding:8px 4px;font-size:13px;gap:5px}
  nav a svg{width:16px;height:16px}
  .hide-s{display:none}
}

main{max-width:1120px;margin:0 auto;padding:28px 16px 80px}
.stack>*+*{margin-top:28px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);margin-top:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--raise)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}

/* inputs */
.field{display:block}
.field span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
.search{position:relative;flex:1;min-width:200px;max-width:420px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* cards and rows */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;border-bottom:4px solid var(--line);transition:border-color .15s,transform .15s}
.tile:hover{border-bottom-color:var(--accent);transform:translateY(-2px)}
.tile h3{font-size:16px;font-weight:700}
.tile p{font-size:14px;color:var(--muted);flex:1}
.tile-f{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--raise);color:var(--muted);width:max-content;max-width:100%}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
a.row:hover{background:var(--raise)}
.ticon{width:42px;height:42px;border-radius:12px;background:var(--raise);display:grid;place-items:center;font-size:20px;flex:none}
.rmain{flex:1;min-width:0}
.rmain b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rprog{width:150px;flex:none;text-align:right}
.rprog small{display:block;margin-top:4px}
@media (max-width:520px){.rprog{width:84px}}
.bar{display:flex;height:8px;border-radius:99px;background:var(--raise);overflow:hidden}
.bar i{display:block;height:100%}
.bar .m{background:var(--ok)}
.bar .l{background:var(--accent)}
.bar.lg{height:12px}
.empty{text-align:center;padding:36px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* stats */
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--line)}
.dot.m{background:var(--ok)}.dot.l{background:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:150px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.week i{display:block;width:100%;max-width:44px;border-radius:8px 8px 3px 3px;background:var(--primary);min-height:4px}
.week i.z{background:var(--raise)}
.two{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media (max-width:760px){.two{grid-template-columns:1fr}}

/* hero */
.hero{background:linear-gradient(135deg,var(--primary),#7b5cff);color:#fff;border-radius:22px;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero p{opacity:.9;margin-top:6px}
.hero .streak{background:rgba(255,255,255,.16);border-radius:16px;padding:12px 18px;font-weight:700;text-align:center}
.hero .streak b{display:block;font-size:28px;line-height:1}
.cont{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cont .rmain{min-width:200px}

/* set page */
.modes{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;display:flex;gap:12px;align-items:center;border-bottom:4px solid var(--line)}
.mode:hover{border-bottom-color:var(--primary)}
.mode span{font-size:26px}
.mode b{display:block}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
.term{display:grid;grid-template-columns:1fr 1.6fr auto;gap:16px;padding:14px 16px;border-top:1px solid var(--line);align-items:center}
.term:first-child{border-top:0}
.term b{font-weight:700;overflow-wrap:anywhere}
.term span{color:var(--muted);overflow-wrap:anywhere}
@media (max-width:560px){.term{grid-template-columns:1fr auto}.term span{grid-column:1;grid-row:2}}
.pill{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:4px 9px;border-radius:999px;background:var(--raise);color:var(--muted);white-space:nowrap}
.pill.m{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.pill.l{background:color-mix(in srgb,var(--accent) 24%,transparent);color:color-mix(in srgb,var(--accent) 60%,var(--fg))}

/* study */
.study{max-width:760px;margin:0 auto}
.study-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.study-top b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flip{perspective:1400px;height:min(380px,56vh);cursor:pointer;margin:16px 0}
.flip-in{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d}
.flip.f .flip-in{transform:rotateX(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:grid;place-items:center;padding:28px;text-align:center;font-size:clamp(22px,4vw,32px);font-weight:700;overflow:auto;overflow-wrap:anywhere}
.face.b{transform:rotateX(180deg);font-weight:500;font-size:clamp(19px,3.2vw,26px)}
.face::before{content:attr(data-l);position:absolute;top:14px;left:18px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ctrl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ctrl .btn{flex:1;max-width:240px;padding:14px}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
.q small{text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:12px}
.q h2{font-size:clamp(22px,4vw,30px);margin:10px 0 24px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:600px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:14px;font-weight:600;display:flex;gap:10px;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--primary)}
.opt kbd{font:inherit;color:var(--muted);font-weight:800}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.fb{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700}
.match{display:grid;gap:10px;grid-template-columns:repeat(4,1fr)}
@media (max-width:600px){.match{grid-template-columns:repeat(2,1fr)}}
.mt{min-height:96px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.mt.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 16%,var(--surface))}
.mt.bad{border-color:var(--bad);animation:shake .3s}
.mt.gone{visibility:hidden}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.done{text-align:center;padding:36px 20px}
.done .big{font-size:56px}
.done h2{font-size:26px;margin:8px 0}
.done .ctrl{margin-top:22px}

/* editor */
.crow{display:grid;grid-template-columns:28px 1fr 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow i{font-style:normal;color:var(--muted);font-weight:700}
@media (max-width:600px){.crow{grid-template-columns:28px 1fr auto}.crow input:nth-of-type(2){grid-column:2}}
.err{color:var(--bad);font-weight:600}

details.topic{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
details.topic+details.topic{margin-top:12px}
details.topic summary{list-style:none;display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
details.topic summary::-webkit-details-marker{display:none}
details.topic summary::after{content:"⌄";color:var(--muted);font-size:20px;transition:transform .2s}
details.topic[open] summary::after{transform:rotate(180deg)}
details.topic .row{border-top:1px solid var(--line)}
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.prof input{max-width:260px;font-size:20px;font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:50;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

      <a class="avatar" id="avatar" href="#profile" aria-label="Your profile">A</a>
    </div>
  </div>
</header>
<main id="app"></main>

/* ---------- storage ---------- */
var mem={};
var store={
  get:function(k,f){try{var v=localStorage.getItem(k);return v==null?(k in mem?mem[k]:f):JSON.parse(v);}catch(e){return k in mem?mem[k]:f;}},
  set:function(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
var KEY='flashcar.v1';
var S=store.get(KEY,null)||{};
if(!S.name)S.name='';
if(!S.library)S.library=['capitals','ielts','cell'];

/* ---------- helpers ---------- */
var $app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function getSet(id){return S.sets[id]||DMAP[id]||null;}
function inLib(id){return S.library.indexOf(id)>=0;}
function libSets(){return S.library.map(getSet).filter(Boolean);}
function topicOf(s){return TOPICS[s.topic]||TOPICS.other;}
function prog(id){if(!S.progress[id])S.progress[id]={cards:{},last:0,best:null};return S.progress[id];}
function lvl(id,cid){var p=S.progress[id];return p&&p.cards[cid]?p.cards[cid].l:0;}
function stats(s){
  var m=0,l=0;s.cards.forEach(function(c){var v=lvl(s.id,c.id);if(v>=2)m++;else if(v===1)l++;});
  var t=s.cards.length||1;
  return {total:s.cards.length,m:m,l:l,n:s.cards.length-m-l,pct:Math.round(m/t*100),mp:m/t*100,lp:l/t*100,last:(S.progress[s.id]||{}).last||0};
}
function record(id,cid,right){
  var p=prog(id),c=p.cards[cid]||(p.cards[cid]={l:0,c:0,w:0});
  if(right){c.c++;c.l=Math.min(2,c.l+1);}else{c.w++;c.l=1;}
  touch(id,1);
}
function touch(id,n){
  prog(id).last=Date.now();
  var k=dayKey();S.activity[k]=(S.activity[k]||0)+n;
  if(!inLib(id))S.library.unshift(id);
  save();
}
function streak(){
  var d=new Date(),n=0;
  if(!S.activity[dayKey(d)])d.setDate(d.getDate()-1);
  while(S.activity[dayKey(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}
function ago(ts){
  if(!ts)return 'Not studied yet';
  var a=new Date(ts),b=new Date();a.setHours(0,0,0,0);b.setHours(0,0,0,0);
  var n=Math.round((b-a)/864e5);
  return n===0?'Studied today':n===1?'Studied yesterday':'Studied '+n+' days ago';
}
function totals(){
  var m=0,l=0,t=0,started=0;

  var ans=0;Object.keys(S.activity).forEach(function(k){ans+=S.activity[k];});
  return {m:m,l:l,t:t,started:started,ans:ans};
}

/* ---------- study modes ---------- */
function startSession(id,mode){
  var s=getSet(id);if(!s||!s.cards.length){session=null;return;}
  var byNeed=shuffle(s.cards).sort(function(a,b){return lvl(id,a.id)-lvl(id,b.id);});
  if(mode==='flash')session={mode:mode,id:id,q:byNeed,i:0,flip:false,right:0,wrong:0};
  else if(mode==='learn'){session={mode:mode,id:id,q:shuffle(byNeed.slice(0,10)),i:0,right:0,wrong:0,pick:null};mkOpts();}
  else{
    var pick=shuffle(s.cards).slice(0,6),tiles=[];
    pick.forEach(function(c){tiles.push({k:c.id,side:'t',x:c.t});tiles.push({k:c.id,side:'d',x:c.d});});
    session={mode:'match',id:id,tiles:shuffle(tiles),sel:null,bad:[],left:pick.length,pairs:pick.length,t0:Date.now(),time:null};
    session.timer=setInterval(function(){var e=document.getElementById('mtime');if(e&&session&&session.mode==='match')e.textContent=((Date.now()-session.t0)/1000).toFixed(1)+' s';},100);
  }
}
function endSession(){if(session&&session.timer)clearInterval(session.timer);session=null;}
function mkOpts(){
  var s=getSet(session.id),c=session.q[session.i],seen={};seen[c.d]=1;
  var o=[];shuffle(s.cards).forEach(function(k){if(!seen[k.d]&&o.length<3){seen[k.d]=1;o.push(k.d);}});
  o.push(c.d);session.opts=shuffle(o);session.pick=null;
}
function studyTop(s,label,n,total){
  return '<div class="study-top"><a class="btn sm ghost" href="#set/'+esc(s.id)+'">← Back</a><b>'+esc(s.title)+'</b><small>'+label+'</small></div><span class="bar"><i class="m" style="width:'+(n/total*100)+'%"></i></span>';
}
function doneView(s,emoji,title,text){
  return '<div class="study"><div class="panel done"><div class="big">'+emoji+'</div><h2>'+title+'</h2><p class="sub">'+text+'</p><div style="max-width:360px;margin:18px auto 0">'+bar(stats(s),1)+'<small style="display:block;margin-top:6px">'+stats(s).pct+'% of this set mastered</small></div><div class="ctrl"><button class="btn pri" data-act="again">Go again</button><a class="btn" href="#set/'+esc(s.id)+'">Back to set</a></div></div></div>';
}
function vStudy(){
  var z=session,s=getSet(z.id);
  if(z.mode==='flash'){
    if(z.i>=z.q.length)return doneView(s,'🏁','You went through every card','Knew '+z.right+', still learning '+z.wrong+'.');
    var c=z.q[z.i];
    return '<div class="study">'+studyTop(s,(z.i+1)+' / '+z.q.length,z.i,z.q.length)+'<div class="flip'+(z.flip?' f':'')+'" data-act="flip" role="button" tabindex="0" aria-label="Flip card"><div class="flip-in"><div class="face" data-l="Term">'+esc(c.t)+'</div><div class="face b" data-l="Definition">'+esc(c.d)+'</div></div></div><div class="ctrl"><button class="btn" data-act="fl" data-id="0">← Still learning</button><button class="btn pri" data-act="fl" data-id="1">Know it →</button></div><p class="hint">Tap the card or press Space to flip. Arrow keys sort it.</p></div>';
  }
  if(z.mode==='learn'){
    if(z.i>=z.q.length)return doneView(s,z.wrong?'💪':'🎉',z.wrong?'Round finished':'Perfect round',z.right+' right, '+z.wrong+' to review.');
    var q=z.q[z.i],done=z.pick!==null;
    return '<div class="study">'+studyTop(s,(z.i+1)+' / '+z.q.length,z.i,z.q.length)+'<div class="q" style="margin-top:16px"><small>Choose the matching definition</small><h2>'+esc(q.t)+'</h2><div class="opts">'+z.opts.map(function(o,i){var cl=done?(o===q.d?' ok':(i===z.pick?' no':'')):'';return '<button class="opt'+cl+'" data-act="opt" data-id="'+i+'"'+(done?' disabled':'')+'><kbd>'+(i+1)+'</kbd><span>'+esc(o)+'</span></button>';}).join('')+'</div>'+(done?'<div class="fb"><span style="color:var(--'+(z.opts[z.pick]===q.d?'ok)">Correct, nice one!':'bad)">Not quite. The right answer is highlighted.')+'</span><button class="btn pri" data-act="next">Continue</button></div>':'')+'</div><p class="hint">Press 1–'+z.opts.length+' to answer, Enter to continue.</p></div>';
  }
  if(z.left===0){
    var best=prog(z.id).best;
    return doneView(s,'⚡','Matched in '+z.time.toFixed(1)+' s',best&&best<z.time?'Your best is '+best.toFixed(1)+' s. Try to beat it.':'That is your best time so far.');
  }
  return '<div class="study"><div class="study-top"><a class="btn sm ghost" href="#set/'+esc(s.id)+'">← Back</a><b>'+esc(s.title)+'</b><small id="mtime">0.0 s</small></div><div class="match">'+z.tiles.map(function(t,i){return '<button class="mt'+(t.gone?' gone':'')+(z.sel===i?' sel':'')+(z.bad.indexOf(i)>=0?' bad':'')+'" data-act="mt" data-id="'+i+'">'+esc(t.x)+'</button>';}).join('')+'</div><p class="hint">Tap a term, then its definition.</p></div>';
}

/* ---------- editor ---------- */
function newDraft(id){
  var s=id&&S.sets[id];
  if(s)return {id:id,title:s.title,topic:s.topic,desc:s.desc||'',cards:s.cards.map(function(c){return {id:c.id,t:c.t,d:c.d};}),next:s.cards.reduce(function(m,c){return Math.max(m,c.id+1);},0),err:''};
  return {id:null,title:'',topic:'languages',desc:'',cards:[{id:0,t:'',d:''},{id:1,t:'',d:''},{id:2,t:'',d:''}],next:3,err:''};
}
function vEdit(){
  var d=draft;
  return '<div class="stack" style="max-width:820px;margin:0 auto"><div class="head"><h1>'+(d.id?'Edit set':'Create a new set')+'</h1><button class="btn pri" data-act="saveSet">Save set</button></div><section class="panel"><label class="field"><span>Title</span><input type="text" data-df="title" maxlength="80" placeholder="e.g. Biology, chapter 4" value="'+esc(d.title)+'"></label><div class="two" style="margin-top:14px"><label class="field"><span>Topic</span><select data-df="topic">'+Object.keys(TOPICS).map(function(k){return '<option value="'+k+'"'+(d.topic===k?' selected':'')+'>'+esc(TOPICS[k].n)+'</option>';}).join('')+'</select></label><label class="field"><span>Description (optional)</span><input type="text" data-df="desc" maxlength="120" value="'+esc(d.desc)+'"></label></div></section><section class="panel"><h2>Cards</h2><div style="margin-top:8px">'+d.cards.map(function(c,i){return '<div class="crow"><i>'+(i+1)+'</i><input type="text" data-ci="'+i+'" data-cf="t" placeholder="Term" aria-label="Term '+(i+1)+'" value="'+esc(c.t)+'"><input type="text" data-ci="'+i+'" data-cf="d" placeholder="Definition" aria-label="Definition '+(i+1)+'" value="'+esc(c.d)+'"><button class="btn sm ghost" data-act="rmCard" data-id="'+i+'" aria-label="Remove card '+(i+1)+'">✕</button></div>';}).join('')+'</div><button class="btn" data-act="addCard" style="margin-top:12px">+ Add card</button></section>'+(d.err?'<p class="err" role="alert">'+esc(d.err)+'</p>':'')+'<div class="head"><a class="btn ghost" href="'+(d.id?'#set/'+esc(d.id):'#materials')+'">Cancel</a><button class="btn pri" data-act="saveSet">Save set</button></div></div>';
}

/* ---------- router ---------- */
function route(){
  var h=(location.hash||'#home').slice(1).split('/'),v=h[0],nav=v;
  endSession();armed=null;
  var html;
  if(v==='materials')html=vMaterials();
  else if(v==='progress')html=vProgress();
  else if(v==='discover')html=vDiscover();
  else if(v==='profile')html=vProfile();
  else if(v==='set'){html=vSet(decodeURIComponent(h[1]||''));nav='materials';}
  else if(v==='study'){startSession(decodeURIComponent(h[1]||''),h[2]||'flash');html=session?vStudy():vSet('');nav='materials';}
  else if(v==='create'||v==='edit'){draft=newDraft(v==='edit'?decodeURIComponent(h[1]||''):null);html=vEdit();nav='materials';}
  else{html=vHome();nav='home';}
  $app.innerHTML=html;
  [].forEach.call(document.querySelectorAll('#nav a'),function(a){var on=a.getAttribute('data-n')===nav;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  var av=document.getElementById('avatar');av.textContent=(S.name||'A').charAt(0).toUpperCase();av.classList.toggle('on',v==='profile');
  window.scrollTo(0,0);
}
function redraw(){
  var v=(location.hash||'#home').slice(1).split('/');
  if(session){$app.innerHTML=vStudy();return;}
  if(v[0]==='create'||v[0]==='edit'){$app.innerHTML=vEdit();return;}
  var y=window.scrollY;
  $app.innerHTML=v[0]==='materials'?vMaterials():v[0]==='progress'?vProgress():v[0]==='discover'?vDiscover():v[0]==='profile'?vProfile():v[0]==='set'?vSet(decodeURIComponent(v[1]||'')):vHome();
  window.scrollTo(0,y);
}

/* ---------- actions ---------- */
function arm(name){if(armed===name){armed=null;return true;}armed=name;redraw();return false;}
var acts={
  lib:function(id){
    var i=S.library.indexOf(id);
    if(i>=0){S.library.splice(i,1);toast('Removed from your materials');}else{S.library.unshift(id);toast('Added to your materials');}
    save();redraw();
  },
  matTopic:function(id){ui.matTopic=id;redraw();},
  disTopic:function(id){ui.disTopic=id;redraw();},
  theme:function(){S.theme=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';save();applyTheme();},
  jump:function(id){var e=document.getElementById('tp-'+id);if(e){e.open=true;e.scrollIntoView({behavior:'smooth',block:'start'});}},
  wipe:function(){if(arm('wipe')){S={name:'',library:[],sets:{},progress:{},activity:{},theme:S.theme};save();toast('Everything erased');redraw();}},
  reset:function(id){if(arm('reset')){delete S.progress[id];save();toast('Progress reset');redraw();}},
  del:function(id){if(arm('del')){delete S.sets[id];delete S.progress[id];S.library=S.library.filter(function(x){return x!==id;});save();toast('Set deleted');location.hash='#materials';}},
  flip:function(){session.flip=!session.flip;var e=document.querySelector('.flip');if(e)e.classList.toggle('f',session.flip);},
  fl:function(v){var z=session;if(z.i>=z.q.length)return;var ok=v==='1';record(z.id,z.q[z.i].id,ok);if(ok)z.right++;else z.wrong++;z.i++;z.flip=false;redraw();},
  opt:function(v){var z=session;if(z.pick!==null)return;z.pick=+v;var q=z.q[z.i],ok=z.opts[z.pick]===q.d;record(z.id,q.id,ok);if(ok)z.right++;else z.wrong++;redraw();var n=document.querySelector('[data-act=next]');if(n)n.focus();},
  next:function(){var z=session;z.i++;if(z.i<z.q.length)mkOpts();redraw();},
  mt:function(v){
    var z=session,i=+v,t=z.tiles[i];if(t.gone||z.bad.length)return;
    if(z.sel===null){z.sel=i;}
    else if(z.sel===i){z.sel=null;}
    else{
      var a=z.tiles[z.sel];
      if(a.k===t.k&&a.side!==t.side){a.gone=t.gone=true;z.sel=null;z.left--;
        if(z.left===0){clearInterval(z.timer);z.time=(Date.now()-z.t0)/1000;var p=prog(z.id);if(!p.best||z.time<p.best)p.best=z.time;touch(z.id,z.pairs);}
      }else{z.bad=[z.sel,i];z.sel=null;setTimeout(function(){if(session===z){z.bad=[];redraw();}},350);}
    }
    redraw();
  },
  again:function(){var z=session;endSession();startSession(z.id,z.mode);redraw();},
  addCard:function(){draft.cards.push({id:draft.next++,t:'',d:''});draft.err='';redraw();var r=document.querySelectorAll('[data-cf=t]');if(r.length)r[r.length-1].focus();},
  rmCard:function(v){draft.cards.splice(+v,1);redraw();},
  saveSet:function(){
    var d=draft,cards=d.cards.map(function(c){return {id:c.id,t:c.t.trim(),d:c.d.trim()};}).filter(function(c){return c.t&&c.d;});
    if(!d.title.trim()){d.err='Give your set a title.';redraw();return;}
    if(cards.length<2){d.err='Add at least two cards with both a term and a definition.';redraw();return;}
    var id=d.id||('my'+Date.now().toString(36));
    S.sets[id]={id:id,title:d.title.trim(),topic:d.topic,desc:d.desc.trim(),cards:cards};
    if(!inLib(id))S.library.unshift(id);
    save();toast('Set saved');location.hash='#set/'+id;
  }
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(armed&&armed!==a)armed=null;
  if(acts[a])acts[a](b.getAttribute('data-id'));
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='matQ'){ui.matQ=t.value;document.getElementById('matList').innerHTML=matList();}
  else if(t.id==='disQ'){ui.disQ=t.value;document.getElementById('disList').innerHTML=disList();}
  else if(t.id==='nameIn'){S.name=t.value.trim();save();var c=(S.name||'A').charAt(0).toUpperCase();[].forEach.call(document.querySelectorAll('.avatar'),function(a){a.textContent=c;});}
  else if(draft&&t.hasAttribute('data-df')){draft[t.getAttribute('data-df')]=t.value;}
  else if(draft&&t.hasAttribute('data-ci')){draft.cards[+t.getAttribute('data-ci')][t.getAttribute('data-cf')]=t.value;}
});
document.addEventListener('keydown',function(e){
  if(!session||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  var z=session;
  if(z.mode==='flash'&&z.i<z.q.length){
    if(e.key===' '||e.key==='Enter'){if(e.key===' '||e.target.classList.contains('flip')){e.preventDefault();acts.flip();}}
    else if(e.key==='ArrowRight')acts.fl('1');
    else if(e.key==='ArrowLeft')acts.fl('0');
  }else if(z.mode==='learn'&&z.i<z.q.length){
    if(z.pick===null&&/^[1-4]$/.test(e.key)&&+e.key<=z.opts.length)acts.opt(String(+e.key-1));
    else if(z.pick!==null&&e.key==='Enter'){e.preventDefault();acts.next();}
  }
});
function applyTheme(){
  var t=S.theme||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');
  document.documentElement.setAttribute('data-theme',t);
}
applyTheme();
window.addEventListener('hashchange',route);
route();
})();
</script>
</body>
</html>
